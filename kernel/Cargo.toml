[package]
name = "tanix-kernel"
version.workspace = true
edition.workspace = true
description = "Tanix microkernel — Phase 3"

[features]
# Build the Zephyr-stub binary path into the kernel image.
# Requires: cargo build --package tanix-zephyr-stub first.
embed-zephyr-stub = []

# Build the Phase-4 server binaries (init/pm/mem/dev/worker) into the kernel.
# Requires: cargo build --package tanix-init --package tanix-pm --package
# tanix-mem --package tanix-dev --package tanix-worker first.
embed-servers = []

# Phase 16: target the QEMU SBSA Reference Platform (`-machine sbsa-ref`)
# instead of the `virt` machine.  Real-hardware style: no `virt`-style
# virtio-mmio transports, PSCI is NOT emulated by QEMU (the EL3 firmware
# must provide it), RAM starts at 1 TiB, GIC at 0x4006_0000 etc.  Requires
# the EL3 monitor at boot (sbsa-ref CPUs reset at EL3).
sbsa-ref = []

# Probe for the Gunyah hypervisor via SMCCC HVC at boot.
# Enable ONLY when actually booting under Gunyah — on bare-metal EL1 an HVC
# is UNDEFINED and would take an unexpected exception.
gunyah = []

[dependencies]
# log facade — no_std compatible; backend registered in arch::aarch64::uart.
log = { version = "0.4", default-features = false }
