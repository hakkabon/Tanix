# systemd-boot loader entry for the Tanix Phase-23 probe kernel.
#
# Usage:
#   1. Build the EFI image:
#        just kernel-qcs6490-efi
#   2. Copy the EFI binary to the Dragon Q6A ESP:
#        cp target/tanix-qcs6490.efi <ESP>/EFI/tanix/tanix.efi
#   3. Copy this file to the ESP:
#        cp scripts/loader-entries/tanix.conf <ESP>/loader/entries/tanix.conf
#   4. Reboot and select "Tanix Phase-23 probe" in the systemd-boot menu.
#
# The stock OS entry is untouched — remove this file to stop Tanix from
# appearing in the boot menu.
#
# Boot protocol:
#   systemd-boot calls LoadImage + StartImage on the EFI binary.
#   The EFI spec passes:  x0 = image handle,  x1 = EFI system table pointer.
#   Tanix's _start (qcs6490 branch in main.rs) stashes x1 into EFI_SYSTAB
#   and enters kmain, which reads the ACPI RSDP from the system table for
#   machine topology discovery.
#
# No 'linux' path workaround needed: Tanix IS the EFI application — not a
# Linux kernel.  systemd-boot's EFI_STUB loader type is NOT used here.

title   Tanix Phase-23 probe (QCS6490)
efi     /EFI/tanix/tanix.efi
